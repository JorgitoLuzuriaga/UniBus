{% extends 'base.html' %}
{% load static %}

{% block content %}
<nav class="navbar navbar-expand-lg navbar-dark bg-dark px-4 mb-4 shadow rounded-bottom">
    <a class="navbar-brand fw-bold" href="{% url 'admin_dashboard' %}">
        <img src="{% static 'img/logo.png' %}" alt="UNL" height="45" class="d-inline-block align-text-top me-2 bg-white rounded-circle p-1">
        Panel Administrativo
    </a>
</nav>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="mb-3">
            <a href="{% url 'admin_vehiculos' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Cancelar y Volver
            </a>
        </div>

        <div class="card shadow">
            <div class="card-header bg-success text-white">
                <h4 class="mb-0"><i class="bi bi-bus-front"></i> Datos del Vehículo</h4>
            </div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100 fw-bold mt-3">Guardar Vehículo</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
