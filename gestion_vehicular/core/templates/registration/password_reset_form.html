{% extends 'base.html' %}
{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow border-0">
                <div class="card-body p-5 text-center">
                    <h3 class="mb-3 text-primary"><i class="bi bi-lock-fill"></i> Recuperar Acceso</h3>
                    <p class="text-muted mb-4">Ingresa tu correo electrónico y te enviaremos un enlace para restablecer tu contraseña.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <div class="mb-3 text-start">
                            <label class="form-label fw-bold">Correo Electrónico</label>
                            <input type="email" name="email" class="form-control form-control-lg" required placeholder="ejemplo@unl.edu.ec">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 btn-lg fw-bold">Enviar Enlace</button>
                    </form>
                    
                    <div class="mt-4">
                        <a href="{% url 'login' %}" class="text-decoration-none text-muted small"><i class="bi bi-arrow-left"></i> Volver al Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
