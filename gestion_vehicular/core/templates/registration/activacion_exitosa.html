{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="text-center mb-4">
                <img src="{% static 'img/logo.png' %}" alt="Logo UNL" height="80" class="mb-3">
            </div>

            <div class="card shadow-lg border-0 rounded-4 text-center">
                <div class="card-body p-5">
                    <div class="mb-4 text-success">
                        <i class="bi bi-check-circle-fill" style="font-size: 4rem;"></i>
                    </div>
                    
                    <h3 class="fw-bold text-dark mb-3">¡Cuenta Activada!</h3>
                    
                    <p class="text-muted">
                        Tu correo institucional ha sido verificado correctamente. Tu cuenta del <strong>Sistema de Gestión de Transporte</strong> ya se encuentra activa y lista para usar.
                    </p>

                    <div class="d-grid gap-2 mt-4">
                        <a href="{% url 'login' %}" class="btn btn-primary btn-lg fw-bold shadow-sm rounded-pill">
                            INICIAR SESIÓN <i class="bi bi-box-arrow-in-right"></i>
                        </a>
                    </div>
                </div>
            </div>

            <div class="text-center mt-4 text-muted small">
                &copy; 2026 Universidad Nacional de Loja
            </div>
        </div>
    </div>
</div>
{% endblock %}
