{% extends 'registration/base_auth.html' %}

{% block title %}Contraseña actualizada{% endblock %}

{% block auth_form %}
<div class="text-center">
    <i class="bi bi-shield-check display-3 text-success"></i>
    <h1 class="h3 fw-bold mt-3 mb-2">Contraseña actualizada</h1>
    <p class="text-muted">Ya puedes iniciar sesión con tu nueva contraseña.</p>
    <a href="{% url 'login' %}" class="btn btn-brand btn-lg w-100 mt-3">Iniciar sesión</a>
</div>
{% endblock %}
